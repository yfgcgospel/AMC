<!DOCTYPE html>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sonova Masking Cal System</title>

  <link rel="icon" href="icon.png"> <!-- 안드로이드 및 일반 브라우저용 아이콘 -->

  <meta property="og:title" content="Sonova Masking Cal System">
  <meta property="og:description" content="Sonova 차폐 도우미">

  <meta property="og:url" content="https://YOUR_USERNAME.github.io/YOUR_REPO/">
  <meta property="og:site_name" content="Sonova Masking Cal System">
